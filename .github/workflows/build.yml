name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build ASI plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install mingw-w64
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-mingw-w64-x86-64

      - name: Build plugin and offline checker
        run: ./tools/package.sh

      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CampFundsWithdraw
          path: |
            dist/CampFundsWithdraw.asi
            dist/CampFundsWithdraw.ini
          if-no-files-found: error
