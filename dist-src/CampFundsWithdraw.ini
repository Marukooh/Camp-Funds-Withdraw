; Camp Funds Withdraw: adds "Withdraw Camp Funds" to Carl's menu (Greymane camp provisions) that converts
; Camp Funds into silver at the inverse of the game's donation rate: since 2.01, 1 copper donated gives
; 10 Camp Funds, so 10 Camp Funds = 1 copper and 1,000 Camp Funds = 1 silver (100 copper = 1 silver).
; Log: CampFundsWithdraw.log next to this file.

[General]
; 0 = plugin does nothing (no menu entry).
Enabled=1
; Text of the entry in Carl's menu.
MenuLabel=Withdraw Camp Funds

[Modal]
Title=Withdraw Camp Funds
; %RATE% = Camp Funds per copper, %FUNDS% = Camp Funds you have, %MAX% = most copper you can take,
; %MAXSILVER% = the same amount in silver (e.g. 12.34). \n = new line.
Text=Convert Camp Funds into silver: %RATE% Camp Funds = 1 copper (100 copper = 1 silver).\nAvailable: %FUNDS% Camp Funds (up to %MAX% copper = %MAXSILVER% silver).
; 1 = under the slider, also show the Camp Funds icon with the amount that will be spent.
ShowCostPreview=1
