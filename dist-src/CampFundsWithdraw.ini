; Camp Funds Withdraw: adds "Withdraw Camp Funds" to Carl's menu (Greymane camp provisions) that converts
; Camp Funds into silver at the inverse of the game's donation rate (10 Camp Funds = 1 silver since 2.01).
; Log: CampFundsWithdraw.log next to this file.

[General]
; 0 = plugin does nothing (no menu entry).
Enabled=1
; Text of the entry in Carl's menu.
MenuLabel=Withdraw Camp Funds

[Modal]
Title=Withdraw Camp Funds
; %RATE% = Camp Funds per silver, %FUNDS% = Camp Funds you have, %MAX% = most silver you can take. \n = new line.
Text=Convert Camp Funds into silver: %RATE% Camp Funds = 1 silver.\nAvailable: %FUNDS% Camp Funds (up to %MAX% silver).
; 1 = under the slider, also show the Camp Funds icon with the amount that will be spent.
ShowCostPreview=1
